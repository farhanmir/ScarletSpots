name: ScarletSpots
options:
  bundleIdPrefix: com.scarletspots
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    # Placeholder — overwritten at build time by the inject_git_sha pre-build script.
    GIT_SHA: "dev"
targets:
  ScarletSpots:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # Keep the handcrafted Info.plist (custom URL schemes, usage strings,
        # and native API/Supabase keys). Using `info.path` makes XcodeGen
        # regenerate and strip it during CI.
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.scarletspots.app
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        # Xcode 26's template default is GENERATE_INFOPLIST_FILE=YES, which
        # makes the build system synthesize a minimal Info.plist from
        # INFOPLIST_KEY_* settings and IGNORE our handcrafted Info.plist.
        # That stripped API_BASE_URL / SUPABASE_URL / CFBundleURLTypes /
        # NS*UsageDescription / UIBackgroundModes from the shipped IPA.
        # Force the build to use Info.plist verbatim.
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: ScarletSpots.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: $(APS_ENVIRONMENT)
    dependencies:
      - package: Supabase
      - sdk: libsqlite3.tbd
      - target: ScarletSpotsWidget
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Inject Git SHA
        # Writes GIT_SHA into the active xcconfig so Info.plist picks it up.
        # Requires ENABLE_USER_SCRIPT_SANDBOXING = NO (already set above).
        script: |
          set -euo pipefail
          SHA=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo "dev")
          XCCONFIG="${SRCROOT}/Config/Debug.xcconfig"
          if [ "${CONFIGURATION}" = "Release" ]; then
            XCCONFIG="${SRCROOT}/Config/Release.xcconfig"
          fi
          # Update GIT_SHA line in place; add it if missing.
          if grep -q "^GIT_SHA" "${XCCONFIG}"; then
            sed -i '' "s/^GIT_SHA = .*/GIT_SHA = ${SHA}/" "${XCCONFIG}"
          else
            echo "GIT_SHA = ${SHA}" >> "${XCCONFIG}"
          fi
        basedOnDependencyAnalysis: false

  ScarletSpotsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
      - path: Shared
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: ScarletSpots Widget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scarletspots.app.widget
        PRODUCT_NAME: "ScarletSpotsWidget"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # Same fix as the main target — without this, Xcode 26 synthesizes
        # its own Info.plist and drops NSExtension, which breaks the widget.
        GENERATE_INFOPLIST_FILE: NO
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.0.0
