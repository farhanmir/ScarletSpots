[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = "(supabase/migrations|tests)"

[tool.bandit]
exclude_dirs = ["tests", "supabase/migrations"]
skips = ["B101"]
