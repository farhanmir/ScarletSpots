name: ScarletSpots
options:
  bundleIdPrefix: com.scarletspots
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
targets:
  ScarletSpots:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scarletspots.app
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        # Xcode 26's template default is GENERATE_INFOPLIST_FILE=YES, which
        # makes the build system synthesize a minimal Info.plist from
        # INFOPLIST_KEY_* settings and IGNORE our handcrafted Info.plist.
        # That stripped API_BASE_URL / SUPABASE_URL / CFBundleURLTypes /
        # NS*UsageDescription / UIBackgroundModes from the shipped IPA.
        # Force the build to use Info.plist verbatim.
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: ScarletSpots.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: $(APS_ENVIRONMENT)
    dependencies:
      - package: Supabase
      - sdk: libsqlite3.tbd
      - target: ScarletSpotsWidget
        embed: true
        codeSign: true

  ScarletSpotsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
      - path: Shared
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: ScarletSpots Widget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scarletspots.app.widget
        PRODUCT_NAME: "ScarletSpotsWidget"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # Same fix as the main target — without this, Xcode 26 synthesizes
        # its own Info.plist and drops NSExtension, which breaks the widget.
        GENERATE_INFOPLIST_FILE: NO
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.0.0
