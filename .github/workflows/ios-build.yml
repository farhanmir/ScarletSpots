name: iOS Build (Native)

on:
  workflow_dispatch:

jobs:
  ios-build:
    name: iOS Build (Native)
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select latest installed Xcode (prefer stable)
        run: |
          XCODE_APPS=()
          while IFS= read -r APP; do
            XCODE_APPS+=("$APP")
          done < <(ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V)
          if [ "${#XCODE_APPS[@]}" -eq 0 ]; then
            echo "::error::No Xcode installation found on runner."
            ls -1d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          XCODE_APP=""
          for APP in "${XCODE_APPS[@]}"; do
            BASENAME=$(basename "$APP")
            if [[ "$BASENAME" != *beta* && "$BASENAME" != *RC* ]]; then
              XCODE_APP="$APP"
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            LAST_INDEX=$((${#XCODE_APPS[@]} - 1))
            XCODE_APP="${XCODE_APPS[$LAST_INDEX]}"
          fi

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "Selected $XCODE_APP"

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/ScarletSpots
        run: xcodegen generate

      - name: Build with xcodebuild (Release, no code signing)
        working-directory: ios/ScarletSpots
        run: |
          xcodebuild \
            -project ScarletSpots.xcodeproj \
            -scheme ScarletSpots \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""
