name: iOS Archive + IPA (Unsigned)

# Manual-only trigger. Kick this off from the Actions tab when you're ready
# to burn minutes; it will not auto-run on push or pull_request.
on:
  workflow_dispatch:
    inputs:
      run_archive:
        description: "Produce unsigned .xcarchive + .ipa artifacts/release"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-build:
    name: Build Check (Simulator)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Verify bundled SQLite matches JSON sources
        run: |
          set -euo pipefail
          python3 ios/scripts/build_sqlite.py --output /tmp/scarletspots.verify.sqlite
          python3 ios/scripts/compare_sqlite.py \
            ios/ScarletSpots/Resources/scarletspots.sqlite \
            /tmp/scarletspots.verify.sqlite

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift Package Manager artifacts
        uses: actions/cache@v5
        with:
          path: |
            ios/ScarletSpots/build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/ScarletSpots/project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Generate Xcode project
        working-directory: ios/ScarletSpots
        run: xcodegen generate

      # If the runner image is mid-rotation the iOS simulator runtime can be
      # missing (see actions/runner-images#13853). Pre-download it just in
      # case; `xcodebuild -downloadPlatform` is a no-op when already present.
      - name: Ensure iOS simulator runtime
        run: xcodebuild -downloadPlatform iOS || true

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios/ScarletSpots
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScarletSpots.xcodeproj \
            -scheme ScarletSpots \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  archive:
    name: Archive + IPA (Unsigned)
    if: inputs.run_archive == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    needs: smoke-build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Verify bundled SQLite matches JSON sources
        run: |
          set -euo pipefail
          python3 ios/scripts/build_sqlite.py --output /tmp/scarletspots.verify.sqlite
          python3 ios/scripts/compare_sqlite.py \
            ios/ScarletSpots/Resources/scarletspots.sqlite \
            /tmp/scarletspots.verify.sqlite

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift Package Manager artifacts
        uses: actions/cache@v5
        with:
          path: |
            ios/ScarletSpots/build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/ScarletSpots/project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      # xcconfig files interpret `//` as the start of a line comment which
      # will silently truncate URLs. We emit them through a helper that
      # escapes the `//` sequence as `/$()/`.
      - name: Generate runtime xcconfig from secrets
        env:
          API_BASE_URL: ${{ vars.IOS_API_BASE_URL }}
          SUPABASE_URL: ${{ vars.IOS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.IOS_SUPABASE_ANON_KEY }}
          TLS_CERT_SHA256: ${{ secrets.IOS_TLS_CERT_SHA256 }}
        run: |
          MISSING=0
          for VAR_NAME in API_BASE_URL SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!VAR_NAME}" ]; then
              echo "::error::Missing required native iOS secret for ${VAR_NAME}"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "Set IOS_API_BASE_URL, IOS_SUPABASE_URL, and IOS_SUPABASE_ANON_KEY before archiving."
            exit 1
          fi

          escape_url() {
            # Replace all "//" occurrences with "/$()/" so xcconfig does not
            # treat the rest of the line as a comment.
            echo "$1" | sed 's|//|/$()/|g'
          }
          {
            echo "API_BASE_URL = $(escape_url "${API_BASE_URL:-}")"
            echo "SUPABASE_URL = $(escape_url "${SUPABASE_URL:-}")"
            echo "SUPABASE_ANON_KEY = ${SUPABASE_ANON_KEY:-}"
            echo "TLS_CERT_SHA256 = ${TLS_CERT_SHA256:-}"
          } > ios/ScarletSpots/Config/ReleaseSecrets.xcconfig

      - name: Generate Xcode project
        working-directory: ios/ScarletSpots
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios/ScarletSpots
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ScarletSpots.xcodeproj \
            -scheme ScarletSpots \
            -destination 'generic/platform=iOS' \
            -archivePath build/ScarletSpots.xcarchive \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""


      - name: Validate archived native API/Supabase settings
        working-directory: ios/ScarletSpots
        run: |
          set -euo pipefail

          APP_PLIST="build/ScarletSpots.xcarchive/Products/Applications/ScarletSpots.app/Info.plist"
          if [ ! -f "$APP_PLIST" ]; then
            echo "::error::Missing archived app Info.plist at $APP_PLIST"
            exit 1
          fi

          read_plist_value() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$APP_PLIST" 2>/dev/null || true
          }

          API_VALUE="$(read_plist_value API_BASE_URL)"
          SUPABASE_VALUE="$(read_plist_value SUPABASE_URL)"
          ANON_VALUE="$(read_plist_value SUPABASE_ANON_KEY)"
          # Keep in sync with placeholder checks in Sources/Core/Env.swift and
          # placeholder defaults in Config/Debug.xcconfig + Config/Release.xcconfig.
          ANON_PLACEHOLDERS=("release-anon-key" "debug-anon-key" "placeholder")

          if [ -z "$API_VALUE" ] || [ -z "$SUPABASE_VALUE" ] || [ -z "$ANON_VALUE" ]; then
            echo "::error::Archived app is missing one or more required Info.plist keys (API_BASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY)."
            exit 1
          fi

          if [[ "$API_VALUE" == *'$('* ]] || [[ "$SUPABASE_VALUE" == *'$('* ]]; then
            echo "::error::Archived app still has unresolved xcconfig placeholders in API_BASE_URL or SUPABASE_URL."
            exit 1
          fi

          if [[ "$API_VALUE" != http://* && "$API_VALUE" != https://* ]]; then
            echo "::error::Archived API_BASE_URL is not an http(s) URL."
            exit 1
          fi

          if ! python3 - "$SUPABASE_VALUE" <<'PY'
          import sys
          from urllib.parse import urlparse

          value = sys.argv[1]
          parsed = urlparse(value)
          host = (parsed.hostname or "").lower()
          scheme = (parsed.scheme or "").lower()
          # Keep in sync with Sources/Core/Env.swift disallowed hosts.
          disallowed = {"example.supabase.co", "placeholder.supabase.co"}
          is_https = scheme == "https"
          has_host = bool(host)
          is_not_placeholder_host = host not in disallowed and not host.endswith(".example.com")
          is_valid = is_https and has_host and is_not_placeholder_host
          raise SystemExit(0 if is_valid else 1)
          PY
          then
            echo "::error::Archived SUPABASE_URL is not a valid Supabase host."
            exit 1
          fi

          IS_ANON_PLACEHOLDER=0
          for placeholder in "${ANON_PLACEHOLDERS[@]}"; do
            if [[ "$ANON_VALUE" == "$placeholder" ]]; then
              IS_ANON_PLACEHOLDER=1
              break
            fi
          done

          if [[ "$ANON_VALUE" == *'$('* || "$IS_ANON_PLACEHOLDER" -eq 1 ]]; then
            echo "::error::Archived SUPABASE_ANON_KEY is still a placeholder."
            exit 1
          fi

      - name: Package unsigned IPA
        working-directory: ios/ScarletSpots
        run: |
          APP_PATH=$(find build/ScarletSpots.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in unsigned archive" >&2
            find build/ScarletSpots.xcarchive -maxdepth 5 -type d || true
            exit 1
          fi

          ICON_SOURCE="Assets.xcassets/AppIcon.appiconset/app-icon-1024.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "Error: App icon source not found at $ICON_SOURCE" >&2
            exit 1
          fi

          rm -rf Payload ScarletSpots.ipa iTunesArtwork iTunesArtwork@2x
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          sips -s format png -z 512 512 "$ICON_SOURCE" --out iTunesArtwork >/dev/null
          cp "$ICON_SOURCE" iTunesArtwork@2x
          zip -r ScarletSpots.ipa Payload/ iTunesArtwork iTunesArtwork@2x
          echo "Created ScarletSpots.ipa with Sideloadly artwork"

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-unsigned
          path: ios/ScarletSpots/build/ScarletSpots.xcarchive
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-unsigned
          path: ios/ScarletSpots/ScarletSpots.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release metadata
        id: release_info
        run: |
          TAG="ios-build-${{ github.run_number }}"
          NAME="iOS Native Sideloading Build ${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release_info.outputs.tag }}" ios/ScarletSpots/ScarletSpots.ipa \
            --title "${{ steps.release_info.outputs.name }}" \
            --generate-notes \
            --prerelease

      - name: Notes
        run: |
          echo "::notice::The archive and IPA are UNSIGNED. Re-sign the IPA with"\
               " your sideloading tool before installing on a device."
