name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Backend: Python lint + tests ─────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Backend quality gate
        run: make check

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TESTING: "true"

  # ── Migration dry-run ─────────────────────────────────────────────────────────
  migrations:
    name: Migration Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify migration file structure
        run: |
          python - <<'PY'
          import pathlib
          import sys

          migration_dir = pathlib.Path("supabase/migrations")
          files = sorted(migration_dir.glob("*.sql"))
          if not files:
              print("No migration files found.")
              sys.exit(1)

          invalid = []
          for file_path in files:
              text = file_path.read_text(encoding="utf-8").strip()
              if not text:
                  invalid.append(f"{file_path}: empty file")
                  continue
              if not any(token in text.upper() for token in ("CREATE ", "ALTER ", "DROP ", "INSERT ", "UPDATE ", "DELETE ")):
                  invalid.append(f"{file_path}: no SQL DDL/DML keywords detected")

          if invalid:
              for issue in invalid:
                  print(issue)
              sys.exit(1)

          print(f"Validated {len(files)} migration files.")
          PY

  website:
    name: Website (Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Validate legal and SEO files
        run: |
          for f in public/privacy.html public/terms.html public/robots.txt public/sitemap.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required website asset: $f"
              exit 1
            fi
            echo "✓ $f"
          done

  # ── Mobile: TypeScript + Expo prebuild check ──────────────────────────────────
  mobile:
    name: Mobile (Expo / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate native module structure
        run: |
          echo "Verifying parking-magic native module..."
          dirs=(
            "modules/parking-magic/ios"
            "modules/parking-magic/src"
          )
          files=(
            "modules/parking-magic/ios/ParkingMagicModule.swift"
            "modules/parking-magic/ios/DatabaseManager.swift"
            "modules/parking-magic/ios/NetworkManager.swift"
            "modules/parking-magic/ios/TicketShield.swift"
            "modules/parking-magic/ios/HapticManager.swift"
            "modules/parking-magic/ios/VultureManager.swift"
            "modules/parking-magic/ios/LiveActivityManager.swift"
            "modules/parking-magic/ios/OfflineQueueManager.swift"
            "modules/parking-magic/ios/ScarletMapView.swift"
            "modules/parking-magic/ios/Resources/rutgers_parking_data.json"
            "modules/parking-magic/ios/Resources/permit_mapping.json"
            "modules/parking-magic/expo-module.config.json"
            "modules/parking-magic/src/index.ts"
          )
          MISSING=0
          for d in "${dirs[@]}"; do
            if [ ! -d "$d" ]; then echo "::error::Missing directory: $d"; MISSING=1; fi
          done
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "::error::Missing file: $f"; MISSING=1; fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "✅ All native module files present."

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Run mobile tests
        run: npm run test

  # ── Swift: Basic syntax lint ───────────────────────────────────────────────────
  swift-lint:
    name: Swift Lint (Native Module)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Select latest installed Xcode 26.x
        run: |
          XCODE_APP=$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 26.x installation found on runner."
            ls -1d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "Selected $XCODE_APP"

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint on parking-magic module
        run: |
          swiftlint lint --path mobile/modules/parking-magic/ios \
            --config .swiftlint.yml 2>/dev/null || \
          swiftlint lint --path mobile/modules/parking-magic/ios

      - name: Swift build check (syntax only)
        run: |
          echo "Checking Swift files compile individually..."
          FAILED=0
          for f in mobile/modules/parking-magic/ios/*.swift; do
            if swiftc -parse "$f" >/dev/null 2>&1; then
              echo "✓ $f"
            else
              echo "::error::Swift parse failed: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
