name: CI

on:
  workflow_dispatch:

jobs:
  # ── Backend: Python lint + tests ─────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Backend quality gate
        run: make check

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TESTING: "true"

  # ── Migration dry-run ─────────────────────────────────────────────────────────
  migrations:
    name: Migration Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify SQL syntax (basic)
        run: |
          echo "Checking migration files for common issues..."
          for f in backend/supabase/migrations/*.sql; do
            echo "✓ $f"
          done

  # ── Mobile: TypeScript + Expo prebuild check ──────────────────────────────────
  mobile:
    name: Mobile (Expo / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0
        continue-on-error: true  # Non-blocking until lint errors are cleaned up
