services:
  app-db:
    image: postgres:17-alpine
    container_name: scarletspots-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-scarletspots}
      POSTGRES_USER: ${APP_DB_USER:-scarlet_admin}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-change-me}
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-scarlet_admin} -d ${APP_DB_NAME:-scarletspots}"]
      interval: 10s
      timeout: 5s
      retries: 5

  logto-db:
    image: postgres:17-alpine
    container_name: scarletspots-logto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOGTO_DB_NAME:-logto}
      POSTGRES_USER: ${LOGTO_DB_USER:-logto}
      POSTGRES_PASSWORD: ${LOGTO_DB_PASSWORD:-change-me}
    volumes:
      - logto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOGTO_DB_USER:-logto} -d ${LOGTO_DB_NAME:-logto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-alpine
    container_name: scarletspots-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  logto:
    image: ghcr.io/logto-io/logto:latest
    container_name: scarletspots-logto
    restart: unless-stopped
    depends_on:
      logto-db:
        condition: service_healthy
    # Try to seed DB on boot, but continue if it's already initialized.
    entrypoint: ["sh", "-c", "npx @logto/cli db seed -- --swe || true; npm start"]
    environment:
      DB_URL: postgresql://${LOGTO_DB_USER:-logto}:${LOGTO_DB_PASSWORD:-change-me}@logto-db:5432/${LOGTO_DB_NAME:-logto}
      # Public-facing endpoint (what gets embedded in tokens as issuer)
      ENDPOINT: http://localhost:3001
      # Admin console endpoint
      ADMIN_ENDPOINT: http://localhost:3002
      TRUST_PROXY_HEADER: "1"
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scarletspots-backend
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      logto:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-scarlet_admin}:${APP_DB_PASSWORD:-change-me}@app-db:5432/${APP_DB_NAME:-scarletspots}
      REDIS_URL: redis://redis:6379/0
      # Backend container reaches Logto via internal service name
      LOGTO_ENDPOINT: http://logto:3001
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  pgadmin:
    image: dpage/pgadmin4:9.3
    container_name: scarletspots-pgadmin
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
      logto-db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@scarletspots.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  app_postgres_data:
  logto_postgres_data:
  pgadmin_data:
